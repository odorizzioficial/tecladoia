name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A acao android-actions/setup-android@v3 foi removida daqui: ela sempre
      # confere se ha versao nova do pacote legado "tools" no repositorio
      # remoto do Google, e como esse pacote foi descontinuado de vez, essa
      # checagem quebra o job antes do Gradle rodar. As maquinas ubuntu-latest
      # do GitHub ja vem com o Android SDK instalado e configurado (variavel
      # ANDROID_HOME/ANDROID_SDK_ROOT pronta), entao essa etapa nem precisa
      # existir para um build simples como este.

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tecladoia-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
