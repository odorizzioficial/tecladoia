name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O Google removeu o pacote legado "tools" do repositório da SDK;
          # essa acao pedia ele por padrao e quebrava por causa disso.
          # platform-tools ja vem pronto na maquina do GitHub, entao nao
          # precisa pedir nada extra aqui.
          packages: ''

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tecladoia-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
